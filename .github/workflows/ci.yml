name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest

    # Matches PingMeWebApplicationFactory and IntegrationTestDbConnection,
    # which both hardcode postgres/postgres on localhost:5432.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore PingMe.slnx

      - name: Build
        run: dotnet build PingMe.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test PingMe.slnx --no-build --configuration Release

  customer-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/pingme-web

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: src/pingme-web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter pingme-customer-app test
      - run: pnpm --filter pingme-customer-app build

  staff-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/pingme-web

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: src/pingme-web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter pingme-staff-app test
      - run: pnpm --filter pingme-staff-app build
